
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Access</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <h1>FLASK PAGE IS WORKING</h1>
    <p>Memory: {{ memory }}</p>
    <div class="container">
        
        <form method="POST" action="{{ url_for('propagation.user', memory=memory) }}">
            <label>Select an identifier:</label>
            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <select name="memory" onchange="window.location.href='/url_navigation/' + this.value">
                <option value="network_design">Network Design</option>
                <option value="user_memory">User Memory</option>
                <option value="service_protocol">Service Protocol</option>
            </select>

            
        </form>

        <h2>Memory Access</h2>
    </div>
</body>
</html>
